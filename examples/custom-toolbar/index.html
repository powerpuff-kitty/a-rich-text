<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Custom styles and toolbar — A Rich Text</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; margin: 2rem auto; max-width: 48rem; padding: 0 1rem; }
  .actions { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-block: 1rem; }
  button { font: inherit; padding: 0.4rem 0.8rem; border: 1px solid #cbd5e1; border-radius: 0.5rem; background: white; }
  button[aria-pressed="true"] { background: #e0e7ff; }
  [hidden] { display: none !important; }
  a-rich-text { --art-font-family: Georgia, serif; --art-color: #172554; --art-border-color: #6366f1; --art-radius: 0.75rem; --art-editor-min-height: 12rem; --art-editor-padding: 1rem; }
  a-rich-text-shell { --art-shell-border: 2px solid #6366f1; --art-shell-radius: .75rem; padding: 1rem; }
  a-rich-text::part(paragraph) { line-height: 1.8; }
  a-rich-text::part(blockquote) { border-inline-start: 4px solid #6366f1; margin-inline: 0; padding-inline-start: 1rem; }
  a-rich-text::part(link) { color: #4338ca; text-decoration-thickness: 2px; }
  output { display: block; white-space: pre-wrap; overflow-wrap: anywhere; margin-block: 1rem; }
</style>
<main>
  <h1>Bring your own toolbar and styles</h1>
  <form>
    <span id="custom-label">Article</span>
    <a-rich-text-shell><div class="actions" role="group" aria-label="Custom formatting">
      <button type="button" data-action="bold" aria-pressed="false">My bold button</button>
      <button type="button" data-action="blockquote">My quote button</button>
      <button type="button" data-action="undo">My undo button</button>
    </div>
    <a-rich-text id="custom-editor" name="article" tools="bold blockquote undo" views="visual html json" aria-labelledby="custom-label"></a-rich-text></a-rich-text-shell>
    <button>Save</button>
  </form>
  <output id="custom-output" aria-live="polite"></output>
</main>
<script type="module">
  import { enableStandardEditing } from './a-rich-text.js';
  const editor = document.querySelector('#custom-editor');
  const controller = enableStandardEditing(editor);
  editor.setHTML('<p>Style me with CSS parts.</p>');
  const buttons = [...document.querySelectorAll('[data-action]')];
  function refresh() {
    for (const button of buttons) {
      const action = button.dataset.action;
      const available = action === 'undo' ? editor.canUndo : Boolean(editor.getSelection());
      button.hidden = editor.disabled || editor.readOnly || editor.view !== 'visual' || !editor.isToolEnabled(action) || !available;
      if (action === 'bold') button.setAttribute('aria-pressed', String(editor.isMarkActive('bold')));
    }
  }
  for (const button of buttons) {
    // Preserve the text selection on pointer activation. Native buttons still support keyboard activation.
    button.addEventListener('pointerdown', event => event.preventDefault());
    button.addEventListener('click', () => {
      if (button.hidden || button.disabled) return;
      const action = button.dataset.action;
      const handled = action === 'bold' ? editor.toggleMark('bold') : action === 'blockquote' ? editor.toggleBlockquote() : editor.undo();
      if (handled) editor.focus({ preventScroll: true });
      refresh();
    });
  }
  for (const event of ['selection-change', 'format-state-change', 'transaction', 'view-change']) editor.addEventListener(event, refresh);
  const observer = new MutationObserver(refresh);
  observer.observe(editor, { attributes: true, attributeFilter: ['tools', 'readonly', 'disabled'] });
  refresh();
  document.querySelector('form').addEventListener('submit', event => {
    event.preventDefault();
    document.querySelector('#custom-output').textContent = new FormData(event.target).get('article');
  });
  // In an SPA's unmount hook: observer.disconnect(); controller.destroy(); remove your event listeners.
</script>
</html>
