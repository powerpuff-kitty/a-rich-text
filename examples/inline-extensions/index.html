<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inline mentions — A Rich Text</title>
<body><main><h1>Inline mentions</h1><p>Place the caret in the editor, then insert a mention. Backspace removes the whole mention; Undo restores it.</p>
<button id="insert" type="button">Insert @Alice</button><button id="runtime" type="button">Remove custom renderer</button>
<a-rich-text id="editor" aria-label="Message" tools="bold italic undo redo"></a-rich-text><p id="status" role="status"></p></main><script type="module" src="./app.js"></script></body></html>
